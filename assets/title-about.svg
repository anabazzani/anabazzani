<style>@font-face{font-family:'Bagel';src:url(data:font/woff2;base64,) format('woff2');}
.spin{animation:spin 40s linear infinite}
.spin2{animation:spin 55s linear infinite reverse}
.bob{animation:bob 4s ease-in-out infinite}
.beat{animation:beat 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}}
</style>
